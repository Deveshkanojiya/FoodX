services:
  postgres:
    image: postgres:16
    container_name: foodx-postgres
    environment:
      POSTGRES_DB: foodx
      POSTGRES_USER: foodx
      POSTGRES_PASSWORD: foodx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: foodx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: foodx-app
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodx
      SPRING_DATASOURCE_USERNAME: foodx
      SPRING_DATASOURCE_PASSWORD: foodx
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: TO_BE_REPLACED_IN_PRODUCTION_WITH_A_LONGER_KEY================
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
