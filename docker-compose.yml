services:
  postgres:
    image: postgres:16
    container_name: foodx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodx
      POSTGRES_USER: foodx
      POSTGRES_PASSWORD: foodx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foodx -d foodx" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - foodx-network

  redis:
    image: redis:7
    container_name: foodx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - foodx-network

  app:
    build: .
    container_name: foodx-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodx
      SPRING_DATASOURCE_USERNAME: foodx
      SPRING_DATASOURCE_PASSWORD: foodx
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: TO_BE_REPLACED_IN_PRODUCTION_WITH_A_LONGER_KEY================
    ports:
      - "8080:8080"
    networks:
      - foodx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: foodx-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
    networks:
      - foodx-network

  grafana:
    image: grafana/grafana:latest
    container_name: foodx-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - foodx-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  foodx-network:
    driver: bridge
